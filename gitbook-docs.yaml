# gitbook-docs.yaml
version: "1"

# Корневой объект site, который настойчиво требует Агент
site:
  # Название вашего сайта (укажите ваше)
  title: "My Documentation Site"
  
  # Описание структуры (структурирует пространства)
  structure:
    - type: space
      # Здесь указывается путь к папке с файлами. 
      # Если файлы лежат прямо в корне проекта, оставьте "./"
      directory: "./"
