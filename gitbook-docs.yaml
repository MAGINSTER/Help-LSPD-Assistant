# .gitbook.yaml
# Указывает Claude и GitBook, как читать структуру папок

# Корень документации (если файлы лежат в корне репозитория, оставьте ./)
root: ./

structure:
  # Главная (первая) страница вашей документации
  readme: README.md
  
  # Файл, который отвечает за левое навигационное меню (меню разделов)
  summary: SUMMARY.md

# Раздел для перенаправлений (опционально, можно оставить пустым)
redirects:
  # пример: old/path: new/path.md
